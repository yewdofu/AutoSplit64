name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        id: setup-python
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Verify Python
        run: |
          uv run python -c "
          import sys, os
          print('Python:', sys.version)
          print('Exe:', sys.executable)
          print('Exec prefix:', sys.exec_prefix)
          dll = os.path.join(sys.exec_prefix, f'python{sys.version_info.major}{sys.version_info.minor}.dll')
          if os.path.exists(dll):
              print('DLL:', dll)
          else:
              dll2 = os.path.join(os.path.dirname(sys.executable), f'python{sys.version_info.major}{sys.version_info.minor}.dll')
              print('DLL (fallback):', dll2, 'exists:', os.path.exists(dll2))
          "

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.21'

      - name: Build with PyInstaller
        run: uv run --group dev pyinstaller -y AutoSplit64.spec

      - name: Show bundled python313.dll path
        run: Get-Item dist\AutoSplit64\_internal\python313.dll | Select-Object FullName, Length

      # 出力名は AS64Updater.exe。リリース zip に "Updater.exe" というエントリを
      # 残さないことで、配布済みの旧 Updater.exe が実行中の自分自身を上書き
      # しようとして展開を中断する問題を回避する。
      - name: Build Updater (Go)
        run: |
          cd updater
          go mod download
          go install github.com/akavel/rsrc@latest
          rsrc -manifest app.manifest -o rsrc.syso
          go build -ldflags="-H windowsgui" -o ..\dist\AutoSplit64\AS64Updater.exe .

      - name: Create zip
        run: Compress-Archive -Path dist\AutoSplit64\* -DestinationPath "AutoSplit64-${{ github.ref_name }}.zip"

      # 公開前の最後のゲート。更新を実行するのは前リリースに同梱された
      # updater なので、ここでの取りこぼしは後続リリースでは直せない。
      - name: Verify release zip
        run: python tools/verify_release_zip.py "AutoSplit64-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>$null; true
          gh release create "${{ github.ref_name }}" "AutoSplit64-${{ github.ref_name }}.zip" --title "AutoSplit64 ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
