name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      UV_PYTHON_PREFERENCE: managed

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13.11 (standalone)
        run: uv python install cpython-3.13.11

      - name: Install dependencies
        run: uv sync --python cpython-3.13.11

      - name: Verify Python
        run: uv run python -c "import sys; print('Python:', sys.version); print('Exe:', sys.executable)"

      - name: Build with PyInstaller
        run: uv run --group dev pyinstaller -y AutoSplit64.spec

      - name: Create zip
        run: Compress-Archive -Path dist\AutoSplit64\* -DestinationPath "AutoSplit64-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" "AutoSplit64-${{ github.ref_name }}.zip" --title "AutoSplit64 ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
